name: Update README cards

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=MKorain&include_all_commits=true&hide=stars,prs,issues&show_icons=true&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&icon_color=58A6FF
          path: profile/stats.svg
          # STATS_PAT (classic, repo + read:user) makes private commits visible.
          # Falls back to GITHUB_TOKEN so the workflow still succeeds without it —
          # public-only counts until the PAT is added.
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=MKorain&layout=compact&langs_count=8&exclude_repo=BulkCoreTemplate&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
